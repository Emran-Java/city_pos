[versions]
template = 'R3.13'
compileSdk = "36"
minSdk = "29"
targetSdk = "33"
agp = "8.12.1"
appcompat = "1.7.0"
constraintlayout = "2.2.1"
room = "2.8.0"
camerax = "1.4.2"
runner = "1.6.2"
junitVersion = "1.2.1"
junit = "4.13.2"
espressoCore = "3.6.1"
#target SDK35, 1.4.0
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
lifecycleExt = "2.2.0"
preference = "1.2.1"
material = "1.12.0"
gson = "2.13.2"
zxing = "3.5.3"
glide = "5.0.5"
eventbus = "3.3.1"
okhttp = "5.1.0"
leakcanary = "2.14"
retrofit = "3.0.0"
picasso = "2.71828"
xstream = "1.4.21"
smart-fun = "1.4.5"
lottie = "6.6.9"
sqlcipher = "4.5.4"
auto-service= "1.1.1"
#newland
hipay-connect = "beta-4.3.03.027-SNAPSHOT"
sensitive-guard = "1.0.0-alpha6"
kotlin = "2.2.0"
coreKtx = "1.17.0"
activity = "1.12.2"

[libraries]
#junit
junit = { module = "junit:junit", version.ref = "junit" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
runner = { module = "androidx.test:runner", version.ref = "runner" }
#androidx
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycleExt" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
#room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
#camear
camerax-camear2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
camerax-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camerax" }
#google
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
material = { module = "com.google.android.material:material", version.ref = "material" }
auto-service = { group = "com.google.auto.service", name = "auto-service", version.ref = "auto-service" }
#glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
#eventbus
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
eventbus-compiler = { module = "org.greenrobot:eventbus-annotation-processor", version.ref = "eventbus" }
#square
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
#xml and json
xstream = { module = "com.thoughtworks.xstream:xstream", version.ref = "xstream" }
smart-fun = { module = "com.github.smart-fun:XmlToJson", version.ref = "smart-fun" }
#airbnb
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
#Encrypt Database
# e.g.
#   123456 is password
#   final byte[] passphrase = SQLiteDatabase.getBytes("123456".toCharArray());
#   final SupportFactory factory = new SupportFactory(passphrase);
#   RoomDatabase.Builder<AcquireDatabase> builder = Room.databaseBuilder(context, AcquireDatabase.class, DB_NAME)
#   .openHelperFactory(factory);
sqlcipher = { module = "net.zetetic:android-database-sqlcipher", version.ref = "sqlcipher" }
#newland
hipay-connect = { group = "com.newlandnpt.payment.api", name = "hi-pay-android", version.ref = "hipay-connect" }
sensitive-guard  = { module = "com.newlandnpt:sensitive-guard", version.ref = "sensitive-guard" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }







